          ignored = {'version', 'chapter_version', 'outline_version', 'style_version', 'environment', 'numpy_version', 'runtime_seconds_environment_specific', 'elapsed_seconds_this_environment'}


          def compare(old, new, path=''):
              if isinstance(old, dict):
                  for key, value in old.items():
                      if key not in ignored:
                          assert key in new, (path, key)
                          compare(value, new[key], path + '/' + key)
              elif isinstance(old, list):
                  assert len(old) == len(new), path
                  for i, (a, b) in enumerate(zip(old, new)):
                      compare(a, b, path + '/' + str(i))
              elif isinstance(old, (int, float)) and not isinstance(old, bool):
                  np.testing.assert_allclose(new, old, rtol=2e-8, atol=1e-10, err_msg=path)
              else:
                  assert new == old, (path, old, new)


          def hide_solutions(source):
              result, inside = [], False
              for line in source.splitlines():
                  if line.strip() == '### BEGIN SOLUTION':
                      assert not inside
                      indent = line[:len(line) - len(line.lstrip())]
                      result.extend([indent + '# TODO: 本文の式を参照して、この部分を実装してください。', indent + 'raise NotImplementedError("Complete the TODO block before running this cell.")'])
                      inside = True
                  elif line.strip() == '### END SOLUTION':
                      assert inside
                      inside = False
                  elif not inside:
                      result.append(line)
              assert not inside
              return '\n'.join(result)


          def optional_key(cell):
              return next(line.split(': ', 1)[1] for line in cell.source.splitlines() if line.startswith('# OPTIONAL EXERCISE:'))


          def execute(notebook, work):
              return NotebookClient(notebook, timeout=600, kernel_name='python3', allow_errors=False, resources={'metadata': {'path': work}}).execute()


          report = []
          for chapter in range(8):
              tag = f'chap{chapter:02d}'
              original = nbformat.read(root / f'notebook/complete/{tag}_complete.ipynb', as_version=4)
              student = nbformat.read(root / f'notebook/student/{tag}_student.ipynb', as_version=4)
              optional = [i for i, c in enumerate(original.cells) if 'optional-exercise' in c.metadata.get('tags', [])]
              expected_keys = {optional_key(original.cells[i]) for i in optional}
              for notebook in [original, student]:
                  nbformat.validate(notebook)
                  for c in notebook.cells:
                      if c.cell_type == 'code':
                          ast.parse(c.source)
              assert len(original.cells) == len(student.cells)
              for i, (answer, cell) in enumerate(zip(original.cells, student.cells)):
                  assert answer.cell_type == cell.cell_type
                  assert ('optional-exercise' in answer.metadata.get('tags', [])) == ('optional-exercise' in cell.metadata.get('tags', []))
                  if cell.cell_type == 'code':
                      assert cell.source == hide_solutions(answer.source), (tag, i, 'student source mismatch')
                      if 'NotImplementedError' in cell.source and i not in optional:
                          cell.source = answer.source
              if optional:
                  save_cells = [i for i, c in enumerate(original.cells) if '"validation.json").write_text' in c.source]
                  assert len(save_cells) == 1 and save_cells[0] < optional[0], (tag, save_cells, optional)
                  animations = [i for i, c in enumerate(original.cells) if c.cell_type == 'code' and 'FuncAnimation(' in c.source]
                  assert all(i < optional[0] for i in animations), (tag, 'animation follows optional exercise')
              empty_exercises = {'status': 'not_applicable' if chapter == 4 else 'not_run', 'results': {}}
              standard, required_files, core_pngs = None, set(), None
              for kind in ['complete', 'student-core', 'student-run-all']:
                  notebook = copy.deepcopy(original if kind == 'complete' else student)
                  # Old saved outputs must not make a stopped execution look successful.
                  for c in notebook.cells:
                      if c.cell_type == 'code':
                          c.outputs, c.execution_count = [], None
                  if kind == 'student-core':
                      for i in optional:
                          notebook.cells[i].metadata.setdefault('tags', []).append('skip-execution')
                  stopped = False
                  with TemporaryDirectory() as work:
                      try:
                          execute(notebook, work)
                      except CellExecutionError:
                          if kind != 'student-run-all' or not optional:
                              raise
                          stopped = True
                      should_stop = kind == 'student-run-all' and bool(optional)
                      assert stopped == should_stop, (tag, kind, stopped)
                      errors = [(i, o) for i, c in enumerate(notebook.cells) for o in c.get('outputs', []) if o.output_type == 'error']
                      if should_stop:
                          assert len(errors) == 1 and errors[0][0] == optional[0] and errors[0][1].ename == 'NotImplementedError', (tag, errors)
                          assert all(c.execution_count is not None for c in notebook.cells[:optional[0]] if c.cell_type == 'code')
                          assert all(c.execution_count is None for c in notebook.cells[optional[0] + 1:] if c.cell_type == 'code')
                      else:
                          assert not errors
                          assert all(c.execution_count is not None for c in notebook.cells if c.cell_type == 'code' and 'skip-execution' not in c.metadata.get('tags', []))
                      code = [c for c in notebook.cells if c.cell_type == 'code' and c.execution_count is not None]
                      warnings = [''.join(o.text) for c in code for o in c.outputs if o.output_type == 'stream' and o.name == 'stderr']
                      assert not warnings, (tag, kind, warnings)
                      pngs = sum('image/png' in o.get('data', {}) for c in code for o in c.outputs)
                      if chapter:
                          assert pngs > 0
                          data = Path(work) / 'output' / tag / 'data'
                          result = json.loads((data / 'validation.json').read_text())
                          exercises = json.loads((data / 'exercise_validation.json').read_text())
                          if kind == 'complete':
                              standard = copy.deepcopy(result)
                              merged = dict(result)
                              for exercise in exercises['results'].values():
                                  assert not (set(exercise) & set(result)), (tag, 'exercise values leaked into standard result')
                                  merged.update(exercise)
                              compare(baseline[tag], merged, tag)
                              assert set(exercises['results']) == expected_keys
                              assert exercises['status'] == ('completed' if optional else 'not_applicable')
                              (artifacts / f'{tag}_validation.json').write_text(json.dumps(result, indent=2))
                              (artifacts / f'{tag}_exercise_validation.json').write_text(json.dumps(exercises, indent=2))
                          else:
                              compare(standard, result, tag + '/' + kind)
                              assert set(standard) == set(result)
                              assert exercises == empty_exercises, exercises
                          files = {p.relative_to(Path(work)) for p in (data.parent).rglob('*') if p.is_file()}
                          if kind == 'student-core':
                              required_files, core_pngs = files, pngs
                          elif kind == 'student-run-all':
                              assert required_files <= files, (tag, 'missing files after Run All', required_files - files)
                              assert pngs == core_pngs, (tag, 'standard figures missing after Run All')
                          if kind == 'complete':
                              # Re-run the real initialization cell with stale memory and disk results.
                              setup = next(c.source for c in notebook.cells if c.cell_type == 'code' and 'exercise_results = {}' in c.source)
                              namespace, old_cwd = {'__name__': '__main__'}, Path.cwd()
                              os.chdir(work)
                              try:
                                  exec(setup, namespace)
                                  namespace['exercise_results']['stale'] = {'value': 99}
                                  namespace['save_exercise_results']()
                                  exec(setup, namespace)
                                  assert namespace['exercise_results'] == {}
                                  assert json.loads((data / 'exercise_validation.json').read_text()) == empty_exercises
                                  for i in optional:
                                      src, key = original.cells[i].source, optional_key(original.cells[i])
                                      prefix = src[:src.index('save_exercise_results()') + len('save_exercise_results()')]
                                      namespace['exercise_results'][key] = {'old': True}
                                      namespace['save_exercise_results']()
                                      exec(prefix, namespace)
                                      assert key not in json.loads((data / 'exercise_validation.json').read_text())['results']
                              finally:
                                  os.chdir(old_cwd)
                      if kind == 'complete':
                          nbformat.write(notebook, artifacts / f'{tag}_complete.ipynb')
                      report.append({'chapter': chapter, 'kind': kind, 'executed_cells': len(code), 'pngs': pngs, 'expected_todo_stop': stopped})
                      print(report[-1], flush=True)
              if chapter == 7:
                  i = optional[0]
                  probe = copy.deepcopy(original)
                  source = probe.cells[i].source.replace('sat_rd = 1.0', 'sat_rd = 2.0')
                  assert source != probe.cells[i].source
                  source += '\nassert sat_rd == 2.0\nassert np.isclose(sat_maxdiff, np.max(np.linalg.norm(sat_diff, axis=2)) / sat_rd)\nassert np.isclose(sat_rmsdiff, np.sqrt(np.mean(np.sum(sat_diff**2, axis=2))) / sat_rd)\n'
                  probe.cells[i].source = source
                  with TemporaryDirectory() as work:
                      execute(probe, work)
                  print('Chapter 7: Rd = 2 kpc normalization passed', flush=True)
          (artifacts / 'report.json').write_text(json.dumps(report, indent=2))
          print('All 8 complete, 8 student-core, 8 student Run All, regression and reset checks passed.', flush=True)
          PY
