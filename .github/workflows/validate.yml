name: Validate teaching materials
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Check distributed sources before regeneration
        run: python code/check_sources.py
      - name: Test regeneration helpers
        run: python code/test_build_tools.py
      - name: Install dependencies and kernel
        run: |
          python -m pip install -r code/requirements.txt
          python -m ipykernel install --user --name python3
      - name: Execute all chapters and independent numerical tests
        run: python code/rebuild.py --execute --test
      - name: Check regenerated sources
        run: python code/check_sources.py
      - name: Check rebuilding chapter zero retains execution output
        run: |
          python code/rebuild.py --chapters 0
          python code/check_sources.py
      - name: Retain new execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-evidence
          path: |
            validation/*_build.log
            validation/*_tests.log
            validation/execution_report.json
            code/chap*/data/independent_tests.json
