name: Validate published notebooks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install notebook environment
        run: |
          python -m pip install -r requirements.txt nbformat nbclient
          python -m ipykernel install --user --name python3
      - name: Validate complete and student notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import ast
          import copy
          import json
          import os
          import subprocess
          import numpy as np
          import nbformat
          from nbclient import NotebookClient
          from nbclient.exceptions import CellExecutionError

          root = Path.cwd()
          artifacts = root / 'validation-results'
          artifacts.mkdir(exist_ok=True)
          expected = {'README.md', 'requirements.txt', 'textbook.pdf', '.gitignore', '.github/workflows/validate.yml'}
          expected |= {f'notebook/{kind}/chap{i:02d}_{kind}.ipynb' for kind in ['complete', 'student'] for i in range(8)}
          actual = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          assert actual == expected, (sorted(actual - expected), sorted(expected - actual))
          assert (root / 'textbook.pdf').read_bytes().startswith(b'%PDF-')

          # Frozen numerical reference, transcribed from the independently checked v2.5 data.
          # This provenance is informational: CI does not read any historical Git objects.
          # Source commit: 7f0fc08e429ffec077f878e55c665d28aef22f4f, code/chapXX/data/validation.json.
